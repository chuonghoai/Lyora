<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="haha-face" cx="38%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="52%" stop-color="#FFC93C" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <linearGradient id="haha-mouth-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A1D0D" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <linearGradient id="haha-tear" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="55%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <clipPath id="haha-mouth-clip">
      <path d="M35 67 Q64 64 93 67 Q91 101 64 101 Q37 101 35 67 Z" />
    </clipPath>
    <style><![CDATA[
      .haha-head {
        transform-origin: 64px 74px;
        animation: hahaRock 1.35s ease-in-out infinite;
      }
      .haha-mouth {
        transform-origin: 64px 68px;
        animation: hahaChomp 0.675s ease-in-out infinite;
      }
      .haha-tear-l {
        transform-origin: 25px 62px;
        animation: hahaTearL 1.35s ease-in-out infinite;
      }
      .haha-tear-r {
        transform-origin: 103px 62px;
        animation: hahaTearR 1.35s ease-in-out infinite;
      }
      @keyframes hahaRock {
        0%, 100% { transform: translateY(0) rotate(-7deg) scale(1, 1); }
        25% { transform: translateY(-4px) rotate(0deg) scale(1.03, 0.97); }
        50% { transform: translateY(0) rotate(7deg) scale(1, 1); }
        75% { transform: translateY(-4px) rotate(0deg) scale(1.03, 0.97); }
      }
      @keyframes hahaChomp {
        0%, 100% { transform: scaleY(0.93); }
        50% { transform: scaleY(1.08); }
      }
      @keyframes hahaTearL {
        0%, 100% { transform: translate(0, 0) scale(0.9); opacity: 0.85; }
        50% { transform: translate(-3px, 2px) scale(1.1); opacity: 1; }
      }
      @keyframes hahaTearR {
        0%, 100% { transform: translate(0, 0) scale(1.1); opacity: 1; }
        50% { transform: translate(3px, 2px) scale(0.9); opacity: 0.85; }
      }
      @media (prefers-reduced-motion: reduce) {
        .haha-head, .haha-mouth, .haha-tear-l, .haha-tear-r {
          animation: none !important;
        }
      }
    ]]></style>
  </defs>

  <ellipse cx="64" cy="116" rx="34" ry="6" fill="#92400E" opacity="0.16" />

  <g class="haha-head">
    <circle cx="64" cy="65" r="47" fill="url(#haha-face)" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.5" />
    <ellipse cx="48" cy="34" rx="22" ry="11" transform="rotate(-16 48 34)" fill="#FFFFFF" opacity="0.35" />

    <!-- Rosy laugh cheeks -->
    <ellipse cx="33" cy="70" rx="8.5" ry="5.5" fill="#FB7185" opacity="0.34" />
    <ellipse cx="95" cy="70" rx="8.5" ry="5.5" fill="#FB7185" opacity="0.34" />

    <!-- Expressive laughing chevron eyes (> <) -->
    <path
      d="M35 46 L50 53.5 L35 61"
      fill="none"
      stroke="#4A1D0D"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M93 46 L78 53.5 L93 61"
      fill="none"
      stroke="#4A1D0D"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Joy tears -->
    <g class="haha-tear-l">
      <path fill="url(#haha-tear)" d="M29 56 C24 58 17 62 17 66.5 C17 69.8 19.8 72.5 23 72.5 C26.4 72.5 29 69.5 29 66 C29 62.5 29 58.5 29 56 Z" />
      <circle cx="21.5" cy="66.5" r="1.8" fill="#FFFFFF" opacity="0.9" />
    </g>
    <g class="haha-tear-r">
      <path fill="url(#haha-tear)" d="M99 56 C104 58 111 62 111 66.5 C111 69.8 108.2 72.5 105 72.5 C101.6 72.5 99 69.5 99 66 C99 62.5 99 58.5 99 56 Z" />
      <circle cx="106.5" cy="66.5" r="1.8" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Wide laughing mouth with pearly teeth and tongue -->
    <g class="haha-mouth">
      <path d="M35 67 Q64 64 93 67 Q91 101 64 101 Q37 101 35 67 Z" fill="url(#haha-mouth-bg)" />
      <g clip-path="url(#haha-mouth-clip)">
        <path d="M34 64 H94 V74.5 Q64 77 34 74.5 Z" fill="#FFFFFF" />
        <ellipse cx="64" cy="96" rx="20" ry="12" fill="#FB7185" />
        <ellipse cx="64" cy="93" rx="13" ry="6" fill="#FDA4AF" opacity="0.55" />
      </g>
    </g>
  </g>
</svg>
