<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="like-orb" cx="34%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="48%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </radialGradient>
    <linearGradient id="like-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="like-hand" x1="25%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="72%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#BFDBFE" />
    </linearGradient>
    <linearGradient id="like-cuff" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
    <style><![CDATA[
      .orb-pulse {
        transform-origin: 64px 66px;
        animation: likeOrb 1.7s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .thumb-hand {
        transform-origin: 48px 88px;
        animation: likeThumb 1.7s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .sparkle-a {
        transform-origin: 99px 26px;
        animation: likeSparkle 1.7s ease-out infinite;
      }
      .sparkle-b {
        transform-origin: 29px 30px;
        animation: likeSparkle 1.7s ease-out 0.16s infinite;
      }
      .sparkle-c {
        transform-origin: 108px 54px;
        animation: likeSparkle 1.7s ease-out 0.28s infinite;
      }
      @keyframes likeOrb {
        0%, 100% { transform: scale(1); }
        22% { transform: scale(1.06, 0.96); }
        42% { transform: scale(0.98, 1.04); }
        62% { transform: scale(1.01); }
      }
      @keyframes likeThumb {
        0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        18% { transform: translate(0, 2px) rotate(6deg) scale(0.95); }
        40% { transform: translate(-1px, -5px) rotate(-14deg) scale(1.1); }
        56% { transform: translate(0, -2px) rotate(-6deg) scale(1.04); }
        72% { transform: translate(0, 0) rotate(2deg) scale(1); }
      }
      @keyframes likeSparkle {
        0%, 24%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
        44% { transform: scale(1.15) rotate(20deg); opacity: 1; }
        70% { transform: scale(0.2) rotate(45deg); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .orb-pulse, .thumb-hand, .sparkle-a, .sparkle-b, .sparkle-c {
          animation: none !important;
        }
        .sparkle-a, .sparkle-b, .sparkle-c { opacity: 0.9; transform: scale(0.85); }
      }
    ]]></style>
  </defs>

  <ellipse cx="64" cy="116" rx="34" ry="6" fill="#1E3A8A" opacity="0.16" />

  <g class="orb-pulse">
    <circle cx="64" cy="66" r="49" fill="url(#like-orb)" stroke="url(#like-rim)" stroke-width="2" />
    <path d="M27 52 C32 30 51 20 71 22 C54 26 39 36 33 54 Z" fill="#FFFFFF" opacity="0.34" />

    <g class="thumb-hand">
      <rect x="33" y="61" width="15" height="31" rx="6" fill="url(#like-cuff)" />
      <circle cx="40.5" cy="84" r="2.6" fill="#2563EB" opacity="0.65" />
      <path
        fill="url(#like-hand)"
        d="M52 60 C55 56 61 48 63 39 C64.2 33.6 67.5 29.5 72 30 C76.6 30.5 79.4 35.2 78 42.5 L75 55 H89.5 C94.8 55 98.4 59 97.6 63.8 C97.2 66.2 95.8 68.1 94 69.2 C95.6 70.6 96.4 72.9 95.7 75.4 C95.1 77.7 93.4 79.3 91.2 80.2 C92.4 81.8 92.7 84.1 91.7 86.2 C90.6 88.5 88.2 90 85.2 90.4 C85.8 92.1 85.4 94.1 84 95.5 C82.5 97 80.2 97.5 77 97.5 H55.5 C53 97.5 51 95.5 51 92.8 V63 C51 61.8 51.4 60.8 52 60 Z"
      />
      <path
        d="M66.5 34.5 C68.5 32.8 71.8 33 72.8 36.2 C71.5 37.8 68.6 38.2 66.5 34.5 Z"
        fill="#FFFFFF"
        opacity="0.85"
      />
    </g>
  </g>

  <path class="sparkle-a" fill="#FEF08A" d="M99 15 L101.8 23.2 L110 26 L101.8 28.8 L99 37 L96.2 28.8 L88 26 L96.2 23.2 Z" />
  <path class="sparkle-b" fill="#FFFFFF" d="M29 21 L31 27.5 L37.5 29.5 L31 31.5 L29 38 L27 31.5 L20.5 29.5 L27 27.5 Z" />
  <path class="sparkle-c" fill="#BAE6FD" d="M108 46 L110 52 L116 54 L110 56 L108 62 L106 56 L100 54 L106 52 Z" />
</svg>
